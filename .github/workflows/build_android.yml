name: Build Google Play Release (AAB & APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle 8.6
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.6'

    - name: Build Android App Bundle (AAB for Google Play Store)
      working-directory: android_app
      env:
        KEYSTORE_PASSWORD: "hypershare2026"
        KEY_ALIAS: "hypershare"
        KEY_PASSWORD: "hypershare2026"
      run: gradle bundleRelease --stacktrace

    - name: Build Universal Signed APK (For Direct Phone Testing)
      working-directory: android_app
      env:
        KEYSTORE_PASSWORD: "hypershare2026"
        KEY_ALIAS: "hypershare"
        KEY_PASSWORD: "hypershare2026"
      run: gradle assembleRelease --stacktrace

    - name: Upload Google Play Store Bundle (.aab)
      uses: actions/upload-artifact@v4
      with:
        name: HyperShare-PlayStore-AAB
        path: android_app/app/build/outputs/bundle/release/*.aab

    - name: Upload Signed APK (.apk)
      uses: actions/upload-artifact@v4
      with:
        name: HyperShare-Signed-APK
        path: android_app/app/build/outputs/apk/release/*.apk

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build Windows PC Executable (HyperShare_PC.exe)
      run: |
        GOOS=windows GOARCH=amd64 go build -ldflags="-H=windowsgui -s -w" -o HyperShare_PC.exe main.go

    - name: Create GitHub Release with APK, AAB & PC App
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v1.1.1
        name: "HyperShare v1.1.1 (Ultra-Fast 5GHz Turbo Engine & Synchronized Dual-Device Transfer Dashboard)"
        body: |
          ### 🚀 HyperShare v1.1.1 - Ultra-Fast Speed Boost & Live Synchronized Dashboard
          - **30-80+ MB/s Maximum Speed Boost**: Upgraded Android socket kernel send/receive buffers to 2MB, enabled `tcpNoDelay = true`, wrapped socket streaming in 256KB buffered output streams, and increased chunk buffers from 64KB to 256KB.
          - **Wi-Fi Power-Save Prevention (802.11 PSM Lock)**: Acquired `WifiLock` (in `WIFI_MODE_FULL_LOW_LATENCY` / `WIFI_MODE_FULL_HIGH_PERF`) and `WakeLock` directly in Android `MainActivity` to eliminate Wi-Fi radio sleep and packet latency.
          - **Zero-CPU ZIP Streaming**: Upgraded `/api/download-all` on Android to use `NO_COMPRESSION` mode, eliminating CPU bottleneck during multi-gigabyte batch downloads.
          - **Synchronized Dual-Screen Transfer Monitor**: Added `/api/stats` endpoint to both Android and Go PC backends. Both Sender (Mobile) and Receiver (PC) screens now light up simultaneously with live speeds, filenames (`📤 در حال ارسال` / `📥 در حال دریافت`), progress bars, and accurate ETAs.
          - **Global Transfer Speedometer HUD**: Relocated the speedometer and transfer monitor to be persistently visible in both Sender and Receiver roles.
          - **Direct Download Feedback**: Instant visual confirmation upon clicking download on Receiver or Sender.
          
          ### 📦 Download Assets:
          - **HyperShare_PC.exe**: Windows Desktop App (Double-click to run native window)
          - **Run_HyperShare.bat**: One-click Windows launcher script
          - **app-release.apk**: Universal Signed Android APK (Install directly on phone)
          - **app-release.aab**: Google Play Store Bundle
        files: |
          android_app/app/build/outputs/apk/release/*.apk
          android_app/app/build/outputs/bundle/release/*.aab
          HyperShare_PC.exe
          Run_HyperShare.bat
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
