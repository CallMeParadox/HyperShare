name: Build Google Play Release (AAB & APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle 8.6
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.6'

    - name: Build Android App Bundle (AAB for Google Play Store)
      working-directory: android_app
      env:
        KEYSTORE_PASSWORD: "hypershare2026"
        KEY_ALIAS: "hypershare"
        KEY_PASSWORD: "hypershare2026"
      run: gradle bundleRelease --stacktrace

    - name: Build Universal Signed APK (For Direct Phone Testing)
      working-directory: android_app
      env:
        KEYSTORE_PASSWORD: "hypershare2026"
        KEY_ALIAS: "hypershare"
        KEY_PASSWORD: "hypershare2026"
      run: gradle assembleRelease --stacktrace

    - name: Upload Google Play Store Bundle (.aab)
      uses: actions/upload-artifact@v4
      with:
        name: HyperShare-PlayStore-AAB
        path: android_app/app/build/outputs/bundle/release/*.aab

    - name: Upload Signed APK (.apk)
      uses: actions/upload-artifact@v4
      with:
        name: HyperShare-Signed-APK
        path: android_app/app/build/outputs/apk/release/*.apk

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build Windows PC Executable (HyperShare_PC.exe)
      run: |
        GOOS=windows GOARCH=amd64 go build -ldflags="-H=windowsgui -s -w" -o HyperShare_PC.exe main.go

    - name: Create GitHub Release with APK, AAB & PC App
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v1.0.7
        name: "HyperShare v1.0.7 (Sender & Receiver Roles, Camera Scanner, Real-Time Live Sync)"
        body: |
          ### ⚡ HyperShare v1.0.7 - Huge Feature Release
          - **Sender & Receiver Role Selector**: Choose whether this device is **Sender (ارسال)** or **Receiver (دریافت)** upon opening or toggle anytime from the top bar!
          - **Real-Time Live Sync (همگام‌سازی بلادرنگ)**: In Receiver mode, any file added or deleted on the Sender instantly reflects on the Receiver screen within 1.5 seconds without page reload!
          - **Auto-Discovery & Connect**: Automatically probes and detects the phone/sender on the local Wi-Fi hotspot (`/api/find-sender`).
          - **Camera QR Scanner**: Mobile receivers can point their camera at the sender's QR code to connect and load files in 2 seconds.
          - **Fixed Null Length Bug**: Fixed edge-case when files list was empty.
          - **100% Standalone Native Desktop Window**: Powered by WebView2 without console or browser dependency.
          
          ### 📦 Download Assets:
          - **HyperShare_PC.exe**: Windows Desktop App (Double-click to run native window)
          - **Run_HyperShare.bat**: One-click Windows launcher script
          - **app-release.apk**: Universal Signed Android APK (Install directly on phone)
          - **app-release.aab**: Google Play Store Bundle
        files: |
          android_app/app/build/outputs/apk/release/*.apk
          android_app/app/build/outputs/bundle/release/*.aab
          HyperShare_PC.exe
          Run_HyperShare.bat
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
