name: Build Google Play Release (AAB & APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle 8.6
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.6'

    - name: Build Android App Bundle (AAB for Google Play Store)
      working-directory: android_app
      env:
        KEYSTORE_PASSWORD: "hypershare2026"
        KEY_ALIAS: "hypershare"
        KEY_PASSWORD: "hypershare2026"
      run: gradle bundleRelease --stacktrace

    - name: Build Universal Signed APK (For Direct Phone Testing)
      working-directory: android_app
      env:
        KEYSTORE_PASSWORD: "hypershare2026"
        KEY_ALIAS: "hypershare"
        KEY_PASSWORD: "hypershare2026"
      run: gradle assembleRelease --stacktrace

    - name: Upload Google Play Store Bundle (.aab)
      uses: actions/upload-artifact@v4
      with:
        name: HyperShare-PlayStore-AAB
        path: android_app/app/build/outputs/bundle/release/*.aab

    - name: Upload Signed APK (.apk)
      uses: actions/upload-artifact@v4
      with:
        name: HyperShare-Signed-APK
        path: android_app/app/build/outputs/apk/release/*.apk

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build Windows PC Executable (HyperShare_PC.exe)
      run: |
        GOOS=windows GOARCH=amd64 go build -ldflags="-H=windowsgui -s -w" -o HyperShare_PC.exe main.go

    - name: Create GitHub Release with APK, AAB & PC App
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v1.1.2
        name: "HyperShare v1.1.2 (Multi-Stream Range Fix, Synchronized Disconnect & 5GHz AP Band Guide)"
        body: |
          ### 🚀 HyperShare v1.1.2 - Parallel Turbo Fix, Disconnect Synchronization & 5GHz Guidance
          - **Fixed Android Multi-Stream Turbo Seeking (`ESPIPE`)**: Resolved the seek crash on `content://` URIs by implementing native Linux `android.system.Os.lseek` with safe byte-skipping fallback. Parallel 8-stream HTTP Range requests now download smoothly without connection drops.
          - **Turbo Parallel Download on Every Receiver Card**: Users can now launch 8-stream parallel downloads directly from any file card in the Receiver view, featuring live animated progress bars for each parallel socket.
          - **Synchronized Disconnect & Instant Speed Reset**: Added `/api/disconnect` and `/api/cancel-transfer` endpoints on both Android and PC backends. When a user clicks "قطع اتصال" on PC, the Mobile sender immediately aborts transfers and resets its speedometer to 0.0 MB/s (`⚡ آماده به کار`).
          - **5GHz Hotspot Optimization & Step-by-Step Guide**: Added an interactive speed booster guide explaining how to switch the phone's Mobile Hotspot from 2.4 GHz (capped at ~5 MB/s) to 5 GHz (reaching 40-90+ MB/s), with a 1-tap shortcut to Android Hotspot Settings.
          - **CORS Range Headers**: Added `Access-Control-Expose-Headers: Content-Range, Content-Length, Accept-Ranges` and preflight headers.
          
          ### 📦 Download Assets:
          - **HyperShare_PC.exe**: Windows Desktop App (Double-click to run native window)
          - **Run_HyperShare.bat**: One-click Windows launcher script
          - **app-release.apk**: Universal Signed Android APK (Install directly on phone)
          - **app-release.aab**: Google Play Store Bundle
        files: |
          android_app/app/build/outputs/apk/release/*.apk
          android_app/app/build/outputs/bundle/release/*.aab
          HyperShare_PC.exe
          Run_HyperShare.bat
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
