name: Build Google Play Release (AAB & APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle 8.6
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.6'

    - name: Build Android App Bundle (AAB for Google Play Store)
      working-directory: android_app
      env:
        KEYSTORE_PASSWORD: "hypershare2026"
        KEY_ALIAS: "hypershare"
        KEY_PASSWORD: "hypershare2026"
      run: gradle bundleRelease --stacktrace

    - name: Build Universal Signed APK (For Direct Phone Testing)
      working-directory: android_app
      env:
        KEYSTORE_PASSWORD: "hypershare2026"
        KEY_ALIAS: "hypershare"
        KEY_PASSWORD: "hypershare2026"
      run: gradle assembleRelease --stacktrace

    - name: Upload Google Play Store Bundle (.aab)
      uses: actions/upload-artifact@v4
      with:
        name: HyperShare-PlayStore-AAB
        path: android_app/app/build/outputs/bundle/release/*.aab

    - name: Upload Signed APK (.apk)
      uses: actions/upload-artifact@v4
      with:
        name: HyperShare-Signed-APK
        path: android_app/app/build/outputs/apk/release/*.apk

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build Windows PC Executable (HyperShare_PC.exe)
      run: |
        GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o HyperShare_PC.exe main.go

    - name: Create GitHub Release with APK, AAB & PC App
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v1.0.4
        name: "HyperShare v1.0.4 (Zero-Copy Instant File Pick, Bi-directional & PC App)"
        body: |
          ### ⚡ HyperShare v1.0.4 - Major Upgrade
          - **Instant Zero-Copy File Selection**: Files appear on screen in milliseconds without heavy copying or disk caching.
          - **Bidirectional Transfer (/api/upload)**: Full 5GHz streaming upload from PC/browser directly into device storage with live progress.
          - **Cancel & Delete Controls**: Remove individual files or clear entire queues on both sharing and upload tabs.
          - **HyperShare PC App**: Standalone Windows executable (`HyperShare_PC.exe`) with auto-browser launch and native Windows file chooser.
          - **app-release.apk**: Universal Signed APK (Android phone install)
          - **app-release.aab**: Official Google Play Store bundle
          - **HyperShare_PC.exe**: Windows PC desktop app
        files: |
          android_app/app/build/outputs/apk/release/*.apk
          android_app/app/build/outputs/bundle/release/*.aab
          HyperShare_PC.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
