name: Build Google Play Release (AAB & APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle 8.6
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.6'

    - name: Build Android App Bundle (AAB for Google Play Store)
      working-directory: android_app
      env:
        KEYSTORE_PASSWORD: "hypershare2026"
        KEY_ALIAS: "hypershare"
        KEY_PASSWORD: "hypershare2026"
      run: gradle bundleRelease --stacktrace

    - name: Build Universal Signed APK (For Direct Phone Testing)
      working-directory: android_app
      env:
        KEYSTORE_PASSWORD: "hypershare2026"
        KEY_ALIAS: "hypershare"
        KEY_PASSWORD: "hypershare2026"
      run: gradle assembleRelease --stacktrace

    - name: Upload Google Play Store Bundle (.aab)
      uses: actions/upload-artifact@v4
      with:
        name: HyperShare-PlayStore-AAB
        path: android_app/app/build/outputs/bundle/release/*.aab

    - name: Upload Signed APK (.apk)
      uses: actions/upload-artifact@v4
      with:
        name: HyperShare-Signed-APK
        path: android_app/app/build/outputs/apk/release/*.apk

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build Windows PC Executable (HyperShare_PC.exe)
      run: |
        GOOS=windows GOARCH=amd64 go build -ldflags="-H=windowsgui -s -w" -o HyperShare_PC.exe main.go

    - name: Create GitHub Release with APK, AAB & PC App
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v1.1.0
        name: "HyperShare v1.1.0 (Full System Audit & Cross-Device Stability Fixes)"
        body: |
          ### 🚀 HyperShare v1.1.0 - Full System Audit & Core Fixes
          - **Fixed Server Port Collision (Singleton Server)**: Resolved `java.net.BindException: Address already in use` by refactoring `EmbeddedServer` into a thread-safe singleton shared between `MainActivity` and `HyperShareService`.
          - **Full Download Support on Android**: Added `DownloadListener` to Android WebView to save files directly into the Android Downloads folder.
          - **Camera QR Scanner Web Permission**: Granted camera access in `WebChromeClient.onPermissionRequest` and added runtime camera permission checks.
          - **Android Share Sheet Integration**: Added handling for incoming `ACTION_SEND` and `ACTION_SEND_MULTIPLE` intents.
          - **Fixed PC Download Links & Dialogs**: Fixed `file.downloadURL` vs `file.download_url` discrepancy, added `-STA` and hidden console to PowerShell file dialogs.
          - **Streaming ZIP Download on Android**: Added `/api/download-all` on-the-fly zip streaming to mobile embedded server.
          - **Prominent Wi-Fi Address Banner**: Sender screen now clearly presents the device's Wi-Fi connection URL with 1-click Copy and QR code buttons.
          - **Global Window Drag & Drop**: Drag files anywhere into the app window to share or queue them.
          
          ### 📦 Download Assets:
          - **HyperShare_PC.exe**: Windows Desktop App (Double-click to run native window)
          - **Run_HyperShare.bat**: One-click Windows launcher script
          - **app-release.apk**: Universal Signed Android APK (Install directly on phone)
          - **app-release.aab**: Google Play Store Bundle
        files: |
          android_app/app/build/outputs/apk/release/*.apk
          android_app/app/build/outputs/bundle/release/*.aab
          HyperShare_PC.exe
          Run_HyperShare.bat
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
