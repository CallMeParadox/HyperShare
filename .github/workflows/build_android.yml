name: Build Google Play Release (AAB & APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle 8.6
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.6'

    - name: Build Android App Bundle (AAB for Google Play Store)
      working-directory: android_app
      env:
        KEYSTORE_PASSWORD: "hypershare2026"
        KEY_ALIAS: "hypershare"
        KEY_PASSWORD: "hypershare2026"
      run: gradle bundleRelease --stacktrace

    - name: Build Universal Signed APK (For Direct Phone Testing)
      working-directory: android_app
      env:
        KEYSTORE_PASSWORD: "hypershare2026"
        KEY_ALIAS: "hypershare"
        KEY_PASSWORD: "hypershare2026"
      run: gradle assembleRelease --stacktrace

    - name: Upload Google Play Store Bundle (.aab)
      uses: actions/upload-artifact@v4
      with:
        name: HyperShare-PlayStore-AAB
        path: android_app/app/build/outputs/bundle/release/*.aab

    - name: Upload Signed APK (.apk)
      uses: actions/upload-artifact@v4
      with:
        name: HyperShare-Signed-APK
        path: android_app/app/build/outputs/apk/release/*.apk

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build Windows PC Executable (HyperShare_PC.exe)
      run: |
        GOOS=windows GOARCH=amd64 go build -ldflags="-H=windowsgui -s -w" -o HyperShare_PC.exe main.go

    - name: Create GitHub Release with APK, AAB & PC App
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v1.1.3
        name: "HyperShare v1.1.3 (Zapya-Style Auto 5GHz Hotspot, SoftApConfig Fix & Dynamic Wi-Fi QR)"
        body: |
          ### 🚀 HyperShare v1.1.3 - Zapya-Style Automatic 5GHz Hotspot & Live Wi-Fi QR
          - **⚡ Automatic 5GHz Local-Only Hotspot (Zapya / SHAREit Style)**: 
            No more manual hotspot configuration or missing 5GHz frequency band settings on Xiaomi/Redmi HyperOS! HyperShare can now automatically spin up a dedicated 5GHz 80MHz Wi-Fi Hotspot using Android's native `WifiManager.startLocalOnlyHotspot()`.
          - **🔑 Android 11+ SoftApConfiguration Support**:
            Resolved an issue where Android 11, 12, 13, and 14 returned `null` for legacy `res.wifiConfiguration`. HyperShare now queries `res.softApConfiguration` to extract the OS-generated SSID and WPA2 passphrase dynamically.
          - **📷 Dynamic Scannable Wi-Fi QR Code**:
            When the auto-hotspot launches, HyperShare automatically opens the QR modal to the Wi-Fi QR tab and displays the exact SSID and password for seamless 1-scan connection from Windows PC, iPhone, or another Android phone.
          - **🛡️ Google Play Compliant Permissions**:
            Added backward-compatible location permissions for Android 10-12 (`maxSdkVersion="32"`) while strictly maintaining Android 13+ modern Wi-Fi permissions (`NEARBY_WIFI_DEVICES` with `neverForLocation`).
          
          ### 📦 Download Assets:
          - **HyperShare_PC.exe**: Windows Desktop App (Double-click to run native window)
          - **Run_HyperShare.bat**: One-click Windows launcher script
          - **app-release.apk**: Universal Signed Android APK (Install directly on phone)
          - **app-release.aab**: Google Play Store Bundle
        files: |
          android_app/app/build/outputs/apk/release/*.apk
          android_app/app/build/outputs/bundle/release/*.aab
          HyperShare_PC.exe
          Run_HyperShare.bat
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
