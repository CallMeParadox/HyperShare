name: Build Google Play Release (AAB & APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle 8.6
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.6'

    - name: Build Android App Bundle (AAB for Google Play Store)
      working-directory: android_app
      env:
        KEYSTORE_PASSWORD: "hypershare2026"
        KEY_ALIAS: "hypershare"
        KEY_PASSWORD: "hypershare2026"
      run: gradle bundleRelease --stacktrace

    - name: Build Universal Signed APK (For Direct Phone Testing)
      working-directory: android_app
      env:
        KEYSTORE_PASSWORD: "hypershare2026"
        KEY_ALIAS: "hypershare"
        KEY_PASSWORD: "hypershare2026"
      run: gradle assembleRelease --stacktrace

    - name: Upload Google Play Store Bundle (.aab)
      uses: actions/upload-artifact@v4
      with:
        name: HyperShare-PlayStore-AAB
        path: android_app/app/build/outputs/bundle/release/*.aab

    - name: Upload Signed APK (.apk)
      uses: actions/upload-artifact@v4
      with:
        name: HyperShare-Signed-APK
        path: android_app/app/build/outputs/apk/release/*.apk

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build Windows PC Executable (HyperShare_PC.exe)
      run: |
        GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o HyperShare_PC.exe main.go

    - name: Create GitHub Release with APK, AAB & PC App
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v1.0.5
        name: "HyperShare v1.0.5 (Windows PC App Auto-Launch & Dynamic Port Fix)"
        body: |
          ### ⚡ HyperShare v1.0.5 - Release Highlights
          - **Windows PC Standalone App Fix**: Added automatic Chrome App Mode / system browser launch so `HyperShare_PC.exe` opens immediately in a clean desktop window.
          - **Dynamic Port Collision Resolver**: If port 8080 is busy or in use, automatically binds to the next free port (8081-8099) without closing or crashing.
          - **Zero-Copy File Picker**: Lightning-fast file selection without copying files into internal app storage.
          - **Bidirectional File Transfers**: Send and receive files seamlessly between Android and Windows PC.
          - **app-release.apk**: Universal Signed APK for Android
          - **app-release.aab**: Google Play Store Bundle
          - **HyperShare_PC.exe**: Windows PC Desktop App
          - **Run_HyperShare.bat**: One-click Windows launcher script
        files: |
          android_app/app/build/outputs/apk/release/*.apk
          android_app/app/build/outputs/bundle/release/*.aab
          HyperShare_PC.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
