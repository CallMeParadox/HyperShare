name: Build Google Play Release (AAB & APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle 8.6
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.6'

    - name: Build Android App Bundle (AAB for Google Play Store)
      working-directory: android_app
      env:
        KEYSTORE_PASSWORD: "hypershare2026"
        KEY_ALIAS: "hypershare"
        KEY_PASSWORD: "hypershare2026"
      run: gradle bundleRelease --stacktrace

    - name: Build Universal Signed APK (For Direct Phone Testing)
      working-directory: android_app
      env:
        KEYSTORE_PASSWORD: "hypershare2026"
        KEY_ALIAS: "hypershare"
        KEY_PASSWORD: "hypershare2026"
      run: gradle assembleRelease --stacktrace

    - name: Upload Google Play Store Bundle (.aab)
      uses: actions/upload-artifact@v4
      with:
        name: HyperShare-PlayStore-AAB
        path: android_app/app/build/outputs/bundle/release/*.aab

    - name: Upload Signed APK (.apk)
      uses: actions/upload-artifact@v4
      with:
        name: HyperShare-Signed-APK
        path: android_app/app/build/outputs/apk/release/*.apk

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build Multi-Distribution Binaries & Packages (Linux, macOS, Windows)
      run: |
        mkdir -p dist
        
        # Install nfpm for building .deb and .rpm packages
        go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
        
        # 1. Build Windows AMD64 & ARM64
        GOOS=windows GOARCH=amd64 go build -ldflags="-H=windowsgui -s -w" -o dist/HyperShare_PC.exe .
        zip -j dist/HyperShare-Windows-x86_64.zip dist/HyperShare_PC.exe Run_HyperShare.bat
        
        GOOS=windows GOARCH=arm64 go build -ldflags="-H=windowsgui -s -w" -o dist/HyperShare_PC_arm64.exe .
        zip -j dist/HyperShare-Windows-arm64.zip dist/HyperShare_PC_arm64.exe Run_HyperShare.bat

        # 2. Build Linux AMD64 (.tar.gz, .deb, .rpm)
        GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o hypershare .
        tar -czvf dist/hypershare-linux-amd64.tar.gz hypershare packaging/linux/install.sh packaging/linux/hypershare.desktop packaging/linux/hypershare.service packaging/icons/hypershare.svg
        ARCH=amd64 nfpm pkg -f packaging/nfpm.yaml --packager deb --target dist/
        ARCH=x86_64 nfpm pkg -f packaging/nfpm.yaml --packager rpm --target dist/
        rm -f hypershare

        # 3. Build Linux ARM64 (.tar.gz, .deb, .rpm)
        GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o hypershare .
        tar -czvf dist/hypershare-linux-arm64.tar.gz hypershare packaging/linux/install.sh packaging/linux/hypershare.desktop packaging/linux/hypershare.service packaging/icons/hypershare.svg
        ARCH=arm64 nfpm pkg -f packaging/nfpm.yaml --packager deb --target dist/
        ARCH=aarch64 nfpm pkg -f packaging/nfpm.yaml --packager rpm --target dist/
        rm -f hypershare

        # 4. Build macOS Darwin AMD64 (Intel) & ARM64 (Apple Silicon)
        GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o hypershare .
        tar -czvf dist/hypershare-darwin-amd64.tar.gz hypershare
        rm -f hypershare

        GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o hypershare .
        tar -czvf dist/hypershare-darwin-arm64.tar.gz hypershare
        rm -f hypershare

        # 5. Generate Checksums
        cd dist && sha256sum * > SHA256SUMS

    - name: Create GitHub Release with Multi-Distribution Packages
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v1.1.3
        name: "HyperShare v1.1.3 (Multi-Distribution Release: Linux, macOS, Windows & Android)"
        body: |
          ### 🚀 HyperShare v1.1.3 - Multi-Distribution & Cross-Platform Release
          This release introduces full multi-distribution support across Linux distributions, macOS, Windows, and Android.
          
          #### 🐧 Linux Distributions:
          - **Debian / Ubuntu / Mint / Pop!_OS**: `.deb` packages (AMD64 & ARM64)
          - **Fedora / RHEL / CentOS / openSUSE**: `.rpm` packages (x86_64 & aarch64)
          - **Arch Linux / Manjaro**: AUR PKGBUILD available in repository (`packaging/arch/PKGBUILD`)
          - **Generic / Alpine / Raspberry Pi**: Standalone `.tar.gz` with universal installer (`install.sh`)
          - **Desktop Integration**: Includes XDG desktop entry (`hypershare.desktop`), systemd user service (`hypershare.service`), and icons.
          
          #### 🍎 macOS:
          - **Apple Silicon (M1/M2/M3/M4)**: `hypershare-darwin-arm64.tar.gz`
          - **Intel x86_64**: `hypershare-darwin-amd64.tar.gz`
          
          #### 🪟 Windows:
          - **Windows x86_64**: `HyperShare-Windows-x86_64.zip` & standalone `HyperShare_PC.exe`
          - **Windows ARM64**: `HyperShare-Windows-arm64.zip`
          
          #### 📱 Android:
          - **app-release.apk**: Universal signed APK (Direct phone installation)
          - **app-release.aab**: Google Play Store Bundle
          
          #### 🔐 Checksums:
          - Check `SHA256SUMS` to verify file integrity.
        files: |
          dist/*
          android_app/app/build/outputs/apk/release/*.apk
          android_app/app/build/outputs/bundle/release/*.aab
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
