name: Build Google Play Release (AAB & APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle 8.6
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.6'

    - name: Build Android App Bundle (AAB for Google Play Store)
      working-directory: android_app
      env:
        KEYSTORE_PASSWORD: "hypershare2026"
        KEY_ALIAS: "hypershare"
        KEY_PASSWORD: "hypershare2026"
      run: gradle bundleRelease --stacktrace

    - name: Build Universal Signed APK (For Direct Phone Testing)
      working-directory: android_app
      env:
        KEYSTORE_PASSWORD: "hypershare2026"
        KEY_ALIAS: "hypershare"
        KEY_PASSWORD: "hypershare2026"
      run: gradle assembleRelease --stacktrace

    - name: Upload Google Play Store Bundle (.aab)
      uses: actions/upload-artifact@v4
      with:
        name: HyperShare-PlayStore-AAB
        path: android_app/app/build/outputs/bundle/release/*.aab

    - name: Upload Signed APK (.apk)
      uses: actions/upload-artifact@v4
      with:
        name: HyperShare-Signed-APK
        path: android_app/app/build/outputs/apk/release/*.apk

    - name: Create GitHub Release with APK & AAB
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v1.0.2
        name: "HyperShare v1.0.2 (Native File Picker Support)"
        body: |
          ### ⚡ HyperShare v1.0.2 - Native File Picker & Offline Enhancement
          - **Native File Picker Support**: Added `onShowFileChooser` and native file picker button for instant selection of videos, photos, APKs from device storage.
          - **Dynamic File Sharing**: Selected files are instantly added to the 5GHz P2P share queue.
          - **100% Offline Speedometer**: Zero internet data consumed during speed benchmarks.
          - **app-release.apk**: Universal Signed APK (Ready to install)
          - **app-release.aab**: Signed Android App Bundle (Google Play Console)
        files: |
          android_app/app/build/outputs/apk/release/*.apk
          android_app/app/build/outputs/bundle/release/*.aab
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
